<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Product Review Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #090d16; color: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hero { background: linear-gradient(135deg, #1e1b4b 0%, #090d16 100%); padding: 40px 0 25px; border-bottom: 1px solid #1e293b; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; }
        .form-control { background: #030712; border: 1px solid #374151; color: #f9fafb; font-size: 1.05rem; }
        .form-control:focus { background: #030712; border-color: #3b82f6; color: #f9fafb; box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25); }
        .verdict-badge { padding: 12px 24px; border-radius: 50px; font-weight: 700; font-size: 1.25rem; display: inline-block; }
        .badge-genuine { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 2px solid #10b981; }
        .badge-fake { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 2px solid #ef4444; }
        .stat-box { background: #1f2937; border-radius: 8px; padding: 15px; text-align: center; }
    </style>
</head>
<body>
    <div class="hero text-center">
        <div class="container">
            <span class="badge bg-danger mb-2"><i class="fas fa-shield-alt me-1"></i> E-Commerce Fraud Prevention</span>
            <h1 class="fw-bold">Fake Product Review Detection System</h1>
            <p class="text-secondary max-w-600 mx-auto">Machine learning NLP classifier trained to identify astroturfed, bot-generated, and incentivized fake online reviews.</p>
        </div>
    </div>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card p-4 shadow-lg mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <label class="form-label fw-bold mb-0"><i class="fas fa-comment-dots text-primary me-2"></i>Product Review Text</label>
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-success" onclick="loadSample('genuine')">Load Genuine Sample</button>
                            <button class="btn btn-outline-danger" onclick="loadSample('fake')">Load Fake Sample</button>
                        </div>
                    </div>
                    <textarea id="reviewInput" class="form-control mb-3" rows="6" placeholder="Enter or paste customer product review here..."></textarea>
                    <button class="btn btn-primary btn-lg fw-bold w-100" onclick="analyzeReview()">
                        <i class="fas fa-search me-2"></i>Analyze Review Veracity
                    </button>
                </div>

                <!-- Analysis Results -->
                <div id="resultCard" class="card p-4 shadow-lg" style="display:none;">
                    <div class="text-center mb-4">
                        <div id="verdictBadge" class="verdict-badge mb-2">Analyzing...</div>
                        <div class="text-secondary" id="confidenceText">Confidence: 0%</div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-6 col-md-3">
                            <div class="stat-box">
                                <small class="text-secondary d-block">Word Count</small>
                                <span class="fs-4 fw-bold" id="statWords">0</span>
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="stat-box">
                                <small class="text-secondary d-block">Exclamations</small>
                                <span class="fs-4 fw-bold" id="statExcl">0</span>
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="stat-box">
                                <small class="text-secondary d-block">Uppercase %</small>
                                <span class="fs-4 fw-bold" id="statCaps">0%</span>
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="stat-box">
                                <small class="text-secondary d-block">Superlatives</small>
                                <span class="fs-4 fw-bold" id="statSuper">0</span>
                            </div>
                        </div>
                    </div>

                    <h6 class="fw-bold text-light mb-2"><i class="fas fa-microscope text-info me-2"></i>Linguistic Diagnostics</h6>
                    <ul id="indicatorsList" class="list-group list-group-flush border-top border-secondary"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        const genuineSample = "The battery lasts about 6 hours on medium brightness. Build quality is solid plastic, decent for the price. Sound is clear but bass is a bit lacking.";
        const fakeSample = "BEST PRODUCT EVER IN THE WORLD!!!!! 100% RECOMMEND TO EVERYONE BUY RIGHT NOW AMAZING A+++++ MIRACULOUS MASTERPIECE!!";

        function loadSample(type) {
            document.getElementById('reviewInput').value = type === 'genuine' ? genuineSample : fakeSample;
        }

        async function analyzeReview() {
            const review = document.getElementById('reviewInput').value.trim();
            if (!review) {
                alert('Please enter a review to analyze.');
                return;
            }

            const res = await fetch('/predict', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({review})
            });
            const data = await res.json();

            document.getElementById('resultCard').style.display = 'block';
            const badge = document.getElementById('verdictBadge');
            badge.innerText = data.verdict;
            badge.className = 'verdict-badge ' + (data.is_fake ? 'badge-fake' : 'badge-genuine');
            document.getElementById('confidenceText').innerText = `Classification Confidence: ${data.confidence}% (Fake: ${data.prob_fake}%, Genuine: ${data.prob_genuine}%)`;

            document.getElementById('statWords').innerText = data.stats.word_count;
            document.getElementById('statExcl').innerText = data.stats.exclamation_count;
            document.getElementById('statCaps').innerText = data.stats.uppercase_ratio + '%';
            document.getElementById('statSuper').innerText = data.stats.superlative_count;

            document.getElementById('indicatorsList').innerHTML = data.indicators.map(ind => 
                `<li class="list-group-item bg-transparent text-secondary py-2 border-secondary"><i class="fas fa-check text-primary me-2"></i>${ind}</li>`
            ).join('');

            window.scrollTo({top: document.getElementById('resultCard').offsetTop - 20, behavior: 'smooth'});
        }
    </script>
</body>
</html>
